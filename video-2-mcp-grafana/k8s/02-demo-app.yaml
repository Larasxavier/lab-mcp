apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: observability
  labels:
    app: checkout-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: checkout-service
          image: checkout-service:lab
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: "checkout-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://lgtm.observability.svc.cluster.local:4317"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: observability
spec:
  selector:
    app: checkout-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
