apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: observability
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load-generator
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                curl -s -o /dev/null http://checkout-service.observability.svc.cluster.local:8080/checkout
                sleep 1
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
